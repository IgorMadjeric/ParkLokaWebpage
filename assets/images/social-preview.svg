<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
    <title id="title">ParkLoka — Remember where you parked</title>
    <desc id="desc">ParkLoka social preview in the app's violet and navy visual style.</desc>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f8f7ff"/>
            <stop offset="1" stop-color="#eeeaff"/>
        </linearGradient>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6554d9" stop-opacity="0.24"/>
            <stop offset="1" stop-color="#6554d9" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#background)"/>
    <circle cx="1060" cy="40" r="350" fill="url(#glow)"/>
    <circle cx="1130" cy="590" r="260" fill="#6554d9" opacity="0.07"/>
    <g transform="translate(80 92)">
